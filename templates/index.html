<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center mb-2 bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
            Universal Video & Audio Downloader
        </h1>
        <p class="text-slate-400 text-center text-sm mb-6">
            Paste any share link from YouTube, Instagram, Facebook, X, TikTok, or 1000+ sites
        </p>

        <!-- Link Input & Paste Bar -->
        <div class="flex gap-2 mb-4">
            <input id="urlInput" type="url" placeholder="Paste share link here..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
            <button onclick="pasteClipboard()" 
                class="bg-slate-700 hover:bg-slate-600 px-3 py-3 rounded-xl text-xs font-semibold shrink-0 transition">
                Paste
            </button>
            <button onclick="fetchInfo()" id="fetchBtn"
                class="bg-blue-600 hover:bg-blue-500 px-5 py-3 rounded-xl text-sm font-semibold shrink-0 transition">
                Analyze
            </button>
        </div>

        <!-- Status / Error Message -->
        <div id="statusMsg" class="hidden text-sm text-center py-2 px-4 rounded-lg mb-4"></div>

        <!-- Video Details & Quality Options Card -->
        <div id="mediaCard" class="hidden bg-slate-900/70 rounded-xl p-4 border border-slate-700 space-y-4">
            <div class="flex gap-4 items-center">
                <img id="thumb" src="" alt="Thumbnail" class="w-28 h-20 object-cover rounded-lg bg-slate-800 shrink-0">
                <div class="overflow-hidden">
                    <span id="platformBadge" class="text-xs bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded font-medium">Platform</span>
                    <h2 id="mediaTitle" class="font-semibold text-sm line-clamp-2 mt-1">Video Title</h2>
                    <p id="mediaDuration" class="text-xs text-slate-400 mt-1"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-800">
                <!-- Type Selector -->
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Type</label>
                    <select id="modeSelect" onchange="updateFormatOptions()" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                        <option value="video">Video + Audio</option>
                        <option value="audio">Audio Only</option>
                    </select>
                </div>

                <!-- Quality Selector -->
                <div id="qualityWrapper">
                    <label class="text-xs text-slate-400 block mb-1">Quality</label>
                    <select id="qualitySelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                        <option value="best">Best Available</option>
                    </select>
                </div>

                <!-- Format Selector -->
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Format</label>
                    <select id="formatSelect" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
                        <option value="mp4">MP4</option>
                        <option value="webm">WEBM</option>
                        <option value="mkv">MKV</option>
                    </select>
                </div>
            </div>

            <button onclick="downloadMedia()" id="downloadBtn"
                class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-semibold text-sm transition shadow-lg">
                Download Now
            </button>
        </div>
    </div>

    <script>
        async function pasteClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('urlInput').value = text;
            } catch (err) {
                showStatus('Please press Ctrl+V or long-press to paste manually.', 'error');
            }
        }

        function showStatus(msg, type = 'info') {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = `text-sm text-center py-2 px-4 rounded-lg mb-4 ${
                type === 'error' ? 'bg-red-500/20 text-red-300 border border-red-500/30' : 'bg-blue-500/20 text-blue-300 border border-blue-500/30'
            }`;
            el.classList.remove('hidden');
        }

        function updateFormatOptions() {
            const mode = document.getElementById('modeSelect').value;
            const formatSelect = document.getElementById('formatSelect');
            const qualityWrapper = document.getElementById('qualityWrapper');
            formatSelect.innerHTML = '';

            if (mode === 'audio') {
                qualityWrapper.classList.add('opacity-40', 'pointer-events-none');
                ['mp3', 'm4a', 'wav'].forEach(ext => {
                    const opt = document.createElement('option');
                    opt.value = ext;
                    opt.textContent = ext.toUpperCase();
                    formatSelect.appendChild(opt);
                });
            } else {
                qualityWrapper.classList.remove('opacity-40', 'pointer-events-none');
                ['mp4', 'webm', 'mkv'].forEach(ext => {
                    const opt = document.createElement('option');
                    opt.value = ext;
                    opt.textContent = ext.toUpperCase();
                    formatSelect.appendChild(opt);
                });
            }
        }

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return showStatus('Please paste a link first!', 'error');

            const btn = document.getElementById('fetchBtn');
            btn.disabled = true;
            btn.textContent = 'Checking...';
            document.getElementById('mediaCard').classList.add('hidden');
            showStatus('Fetching available formats and qualities...', 'info');

            try {
                const res = await fetch('/api/info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to analyze link');

                document.getElementById('statusMsg').classList.add('hidden');
                document.getElementById('thumb').src = data.thumbnail || 'https://via.placeholder.com/150';
                document.getElementById('mediaTitle').textContent = data.title;
                document.getElementById('platformBadge').textContent = data.extractor;
                document.getElementById('mediaDuration').textContent = data.duration ? `Duration: ${data.duration}` : '';

                const qSelect = document.getElementById('qualitySelect');
                qSelect.innerHTML = '<option value="best">Best Available</option>';
                (data.resolutions || []).forEach(res => {
                    const opt = document.createElement('option');
                    opt.value = res;
                    opt.textContent = `${res}p`;
                    qSelect.appendChild(opt);
                });

                document.getElementById('mediaCard').classList.remove('hidden');
            } catch (err) {
                showStatus(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        async function downloadMedia() {
            const url = document.getElementById('urlInput').value.trim();
            const mode = document.getElementById('modeSelect').value;
            const quality = document.getElementById('qualitySelect').value;
            const format = document.getElementById('formatSelect').value;

            const btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            btn.textContent = 'Processing & Merging (Please wait)...';
            showStatus('Downloading and converting media on server. Large HD videos may take 15-40 seconds...', 'info');

            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, mode, quality, format })
                });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error || 'Download failed');
                }

                // Extract filename and trigger browser save dialog
                const disposition = res.headers.get('Content-Disposition');
                let filename = `download.${format}`;
                if (disposition && disposition.includes('filename=')) {
                    filename = disposition.split('filename=')[1].replace(/"/g, '');
                }

                const blob = await res.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
                showStatus('Download complete!', 'info');
            } catch (err) {
                showStatus(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Download Now';
            }
        }
    </script>
</body>
</html>
